<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header>
      <p>simple product page</p>
    </header>
    <main>
      <div id="search">
        <input id="search-input" type="text" placeholder="search name..." />
        <div>
          <button class="filter" data-filter="all">All</button>
          <button class="filter" data-filter="tech">Teach</button>
          <button class="filter" data-filter="clothing">Clothing</button>
          <button class="filter" data-filter="helth">Helth</button>
        </div>
        <div>
          <input type="number" placeholder="search price ..." />
          <button>search</button>
        </div>
      </div>
      <div id="products">
        <div class="product-item" data-category="tech">
          <img src="./img/iphone.png" alt="" />
          <p>Apple Iphone 14 pro</p>
          <span>$ 1499</span>
        </div>

        <div class="product-item" data-category="clothing">
          <img src="./img/shoes.png" alt="" />
          <p>Runnig Shoes</p>
          <span>$ 199</span>
        </div>

        <div class="product-item" data-category="tech">
          <img src="./img/watch.png" alt="" />
          <p>Apple Watch</p>
          <span>$ 399</span>
        </div>

        <div class="product-item" data-category="clothing">
          <img src="./img/bag.png" alt="" />
          <p>College Bag</p>
          <span>$ 139</span>
        </div>

        <div class="product-item" data-category="clothing">
          <img src="./img/jacket.png" alt="" />
          <p>Boy's Jacket</p>
          <span>$ 1499</span>
        </div>

        <div class="product-item" data-category="helth">
          <img src="./img/shampoo.png" alt="" />
          <p>Keratin Hair Care</p>
          <span>$ 39</span>
        </div>

        <div class="product-item" data-category="tech">
          <img src="./img/airpods.png" alt="" />
          <p>Apple Airpods pro</p>
          <span>$ 299</span>
        </div>

        <div class="product-item" data-category="helth">
          <img src="./img/vitamin.png" alt="" />
          <p>Vitamin E</p>
          <span>$ 39</span>
        </div>

        <div class="product-item" data-category="helth">
          <img src="./img/cream.png" alt="" />
          <p>Face Cream</p>
          <span>$ 39</span>
        </div>
      </div>
    </main>

    <script src="./js/app.js"></script>
  </body>
</html>
